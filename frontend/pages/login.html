<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — BlogSphere</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .auth-page-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2rem;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand" aria-label="BlogSphere Home">
        <img src="../assets/logo.svg" alt="BlogSphere" style="height: 38px;" />
      </a>
      <div class="nav-actions">
        <button class="btn-icon theme-toggle-btn" aria-label="Toggle Light and Dark Mode" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-page-wrapper">
      <div class="auth-box">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Welcome Back</h1>
          <p style="font-size: 0.95rem; color: var(--text-muted);">Sign in to your BlogSphere account</p>
        </div>

        <!-- Alert Container -->
        <div id="auth-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1.5rem; background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger);"></div>

        <!-- Quick Demo Credentials Box -->
        <div style="background: var(--bg-tertiary); border: 1px dashed var(--border-strong); border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.5rem; text-align: center;">
          <div style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem;">Quick Demo Fill</div>
          <div style="display: flex; gap: 0.5rem; justify-content: center;">
            <button type="button" class="btn btn-outline btn-sm" id="btn-fill-admin" style="font-size: 0.78rem;">🛡️ Fill Admin</button>
            <button type="button" class="btn btn-outline btn-sm" id="btn-fill-author" style="font-size: 0.78rem;">✍️ Fill Author</button>
          </div>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input
              type="email"
              id="login-email"
              class="form-input"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
              <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            </div>
            <div style="position: relative;">
              <input
                type="password"
                id="login-password"
                class="form-input"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                id="btn-toggle-password"
                style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);"
                aria-label="Toggle password visibility"
              >👁️</button>
            </div>
          </div>

          <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
            Sign In
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--text-muted);">
          Don't have an account? <a href="register.html" style="font-weight: 600;">Sign up</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/ui.js" type="module"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/validation.js" type="module"></script>

  <script type="module">
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("login-form");
      const emailInput = document.getElementById("login-email");
      const passwordInput = document.getElementById("login-password");
      const alertBox = document.getElementById("auth-alert");
      const submitBtn = document.getElementById("btn-submit-login");

      // Demo quick fills
      document.getElementById("btn-fill-admin").onclick = () => {
        emailInput.value = "admin@blogsphere.dev";
        passwordInput.value = "AdminPassword123!";
      };
      document.getElementById("btn-fill-author").onclick = () => {
        emailInput.value = "alex.morgan@blogsphere.dev";
        passwordInput.value = "AuthorPassword123!";
      };

      // Toggle password visibility
      const toggleBtn = document.getElementById("btn-toggle-password");
      toggleBtn.onclick = () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        toggleBtn.textContent = isPassword ? "🔒" : "👁️";
      };

      form.onsubmit = async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in...";

        try {
          await window.auth.login(email, password);
          window.showToast("✓ Login successful! Redirecting...", "success");

          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get("redirect");

          setTimeout(() => {
            if (redirect && !redirect.includes("login.html") && !redirect.includes("register.html")) {
              window.location.href = decodeURIComponent(redirect);
            } else {
              window.location.href = "dashboard.html";
            }
          }, 600);
        } catch (err) {
          alertBox.textContent = err.message || "Invalid credentials.";
          alertBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign In";
        }
      };
    });
  </script>
</body>
</html>
