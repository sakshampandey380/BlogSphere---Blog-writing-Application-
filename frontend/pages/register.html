<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — BlogSphere</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <style>
    .auth-page-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      max-width: 460px;
      width: 100%;
      padding: 2.5rem 2rem;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand" aria-label="BlogSphere Home">
        <img src="../assets/logo.svg" alt="BlogSphere" style="height: 38px;" />
      </a>
      <div class="nav-actions">
        <button class="btn-icon theme-toggle-btn" aria-label="Toggle Light and Dark Mode" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="auth-page-wrapper">
      <div class="auth-box">
        
        <div style="text-align: center; margin-bottom: 2rem;">
          <h1 style="font-size: 1.85rem; margin-bottom: 0.5rem;">Join BlogSphere</h1>
          <p style="font-size: 0.95rem; color: var(--text-muted);">Create your account to start writing and sharing ideas</p>
        </div>

        <div id="auth-alert" style="display: none; padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.88rem; margin-bottom: 1.5rem; background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger);"></div>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="register-name">Full Name *</label>
            <input
              type="text"
              id="register-name"
              class="form-input"
              placeholder="e.g. Elena Rostova"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="register-email">Email Address *</label>
            <input
              type="email"
              id="register-email"
              class="form-input"
              placeholder="elena@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="register-password">Password *</label>
            <input
              type="password"
              id="register-password"
              class="form-input"
              placeholder="At least 6 characters"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="register-confirm-password">Confirm Password *</label>
            <input
              type="password"
              id="register-confirm-password"
              class="form-input"
              placeholder="Re-enter your password"
              required
            />
          </div>

          <button type="submit" id="btn-submit-register" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
            Create Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.92rem; color: var(--text-muted);">
          Already have an account? <a href="login.html" style="font-weight: 600;">Sign in</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/ui.js" type="module"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/validation.js" type="module"></script>

  <script type="module">
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("register-form");
      const nameInput = document.getElementById("register-name");
      const emailInput = document.getElementById("register-email");
      const passwordInput = document.getElementById("register-password");
      const confirmInput = document.getElementById("register-confirm-password");
      const alertBox = document.getElementById("auth-alert");
      const submitBtn = document.getElementById("btn-submit-register");

      form.onsubmit = async (e) => {
        e.preventDefault();
        alertBox.style.display = "none";

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (name.length < 2) {
          alertBox.textContent = "Please enter a valid full name.";
          alertBox.style.display = "block";
          return;
        }

        const emailErr = window.validateEmail(email);
        if (emailErr) {
          alertBox.textContent = emailErr;
          alertBox.style.display = "block";
          return;
        }

        const pwdErr = window.validatePassword(password, 6);
        if (pwdErr) {
          alertBox.textContent = pwdErr;
          alertBox.style.display = "block";
          return;
        }

        if (password !== confirm) {
          alertBox.textContent = "Passwords do not match.";
          alertBox.style.display = "block";
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        try {
          await window.auth.register(name, email, password);
          window.showToast("✓ Account created! Welcome to BlogSphere.", "success");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 600);
        } catch (err) {
          alertBox.textContent = err.message || "Unable to register account.";
          alertBox.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "Create Account";
        }
      };
    });
  </script>
</body>
</html>
