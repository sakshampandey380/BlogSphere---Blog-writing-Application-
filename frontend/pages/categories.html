<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Topics & Categories — BlogSphere</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand" aria-label="BlogSphere Home">
        <img src="../assets/logo.svg" alt="BlogSphere" style="height: 38px;" />
      </a>

      <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu">☰</button>

      <ul class="nav-links" id="nav-links">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="categories.html" class="nav-link active">Categories</a></li>
        <li><a href="../index.html#posts-section" class="nav-link">Articles</a></li>
      </ul>

      <div class="nav-actions">
        <button class="btn-icon theme-toggle-btn" aria-label="Toggle Light and Dark Mode" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem;">
        <div>
          <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Explore by Topic</h1>
          <p style="color: var(--text-muted);">Browse insightful articles across engineering, artificial intelligence, security, and design.</p>
        </div>
        <div id="admin-create-category-btn-wrapper" style="display: none;">
          <button class="btn btn-primary" id="btn-open-category-modal">+ Add Category</button>
        </div>
      </div>

      <!-- Categories Grid -->
      <div class="posts-grid" id="categories-directory-grid">
        <!-- Rendered dynamically -->
      </div>

      <!-- Admin Add Category Modal -->
      <div id="category-modal" class="modal-overlay">
        <div class="modal-box">
          <div class="modal-header">
            <h4 class="modal-title">Create New Category</h4>
            <button class="btn-icon btn-sm" id="btn-close-cat-modal">✕</button>
          </div>
          <form id="modal-category-form">
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label" for="modal-cat-name">Category Name *</label>
                <input type="text" id="modal-cat-name" class="form-input" placeholder="e.g. Cloud Computing" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="modal-cat-desc">Description</label>
                <textarea id="modal-cat-desc" class="form-textarea" rows="3" placeholder="Brief description of topics covered in this category..."></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-sm" id="btn-cancel-cat-modal">Cancel</button>
              <button type="submit" class="btn btn-primary btn-sm" id="btn-save-cat-modal">Create Category</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <div>© 2026 BlogSphere. Topics & Taxonomy.</div>
      <div><a href="../index.html">← Back to BlogSphere Home</a></div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/ui.js" type="module"></script>
  <script src="../js/auth.js"></script>

  <script type="module">
    document.addEventListener("DOMContentLoaded", async () => {
      const grid = document.getElementById("categories-directory-grid");
      const adminBtnWrapper = document.getElementById("admin-create-category-btn-wrapper");
      const modal = document.getElementById("category-modal");
      const openModalBtn = document.getElementById("btn-open-category-modal");
      const closeModalBtn = document.getElementById("btn-close-cat-modal");
      const cancelModalBtn = document.getElementById("btn-cancel-cat-modal");
      const form = document.getElementById("modal-category-form");

      if (window.auth && window.auth.isAdmin()) {
        adminBtnWrapper.style.display = "block";
      }

      const loadDirectory = async () => {
        try {
          const res = await window.api.get("/categories");
          if (res && res.success && res.data) {
            grid.innerHTML = res.data.map(cat => `
              <div class="editor-card" style="display: flex; flex-direction: column; justify-content: space-between; transition: all var(--transition-base);">
                <div>
                  <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem;">
                    <h3 style="font-size: 1.35rem; font-weight: 700;">
                      <a href="../index.html?category=${encodeURIComponent(cat.slug)}" style="color: inherit;">${cat.name}</a>
                    </h3>
                    <span class="category-badge">${cat.posts_count || 0} Posts</span>
                  </div>
                  <p style="font-size: 0.92rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 1.5rem;">
                    ${cat.description || "Discover high-quality articles in this domain."}
                  </p>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 1rem;">
                  <code style="font-size: 0.8rem; color: var(--text-muted);">/${cat.slug}</code>
                  <a href="../index.html?category=${encodeURIComponent(cat.slug)}" class="read-more-link">Browse Articles →</a>
                </div>
              </div>
            `).join("");
          }
        } catch (err) {
          grid.innerHTML = `<p style="color: var(--danger);">Failed to load categories.</p>`;
        }
      };

      await loadDirectory();

      // Modal handlers
      if (openModalBtn) openModalBtn.onclick = () => modal.classList.add("show");
      const hideModal = () => modal.classList.remove("show");
      if (closeModalBtn) closeModalBtn.onclick = hideModal;
      if (cancelModalBtn) cancelModalBtn.onclick = hideModal;

      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById("modal-cat-name").value.trim();
          const description = document.getElementById("modal-cat-desc").value.trim();

          try {
            const res = await window.api.post("/categories", { name, description });
            if (res && res.success) {
              window.showToast("✓ Category created successfully!", "success");
              hideModal();
              form.reset();
              loadDirectory();
            }
          } catch (err) {
            window.showToast(err.message || "Failed to create category", "error");
          }
        };
      }
    });
  </script>
</body>
</html>
