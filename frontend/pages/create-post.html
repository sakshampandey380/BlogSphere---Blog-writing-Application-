<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Article — BlogSphere</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand" aria-label="BlogSphere Home">
        <img src="../assets/logo.svg" alt="BlogSphere" style="height: 38px;" />
      </a>

      <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu">☰</button>

      <ul class="nav-links" id="nav-links">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="categories.html" class="nav-link">Categories</a></li>
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      </ul>

      <div class="nav-actions">
        <button class="btn-icon theme-toggle-btn" aria-label="Toggle Light and Dark Mode" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <div id="nav-auth-container"></div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Breadcrumbs -->
      <nav style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.5rem;">
        <a href="dashboard.html" style="color: var(--text-muted);">Dashboard</a>
        <span style="margin: 0 0.5rem;">/</span>
        <span id="editor-breadcrumbs-current" style="color: var(--text-primary); font-weight: 600;">New Article</span>
      </nav>

      <div class="section-header" style="margin-bottom: 1rem;">
        <h1 id="editor-page-title" style="font-size: 2rem;">Write New Article</h1>
      </div>

      <!-- Editor Form -->
      <form id="post-editor-form">
        <div class="editor-layout">
          
          <!-- Left Column: Main Editor -->
          <div>
            <div class="editor-card" style="margin-bottom: 1.5rem;">
              
              <!-- Post Title -->
              <div class="form-group">
                <label class="form-label" for="post-title">Article Title *</label>
                <input
                  type="text"
                  id="post-title"
                  class="form-input"
                  placeholder="e.g. Modern Web Architecture Patterns for 2026"
                  required
                />
              </div>

              <!-- Post Slug -->
              <div class="form-group">
                <label class="form-label" for="post-slug">URL Slug</label>
                <input
                  type="text"
                  id="post-slug"
                  class="form-input"
                  placeholder="modern-web-architecture-patterns-for-2026"
                />
                <div class="form-hint">Preview: <code>/post/<span id="slug-preview">your-slug</span></code></div>
              </div>

              <!-- Short Excerpt -->
              <div class="form-group">
                <label class="form-label" for="post-excerpt">Short Excerpt (Summary)</label>
                <textarea
                  id="post-excerpt"
                  class="form-textarea"
                  rows="2"
                  placeholder="Briefly describe what readers will learn from this article (max 300 characters)..."
                ></textarea>
              </div>

            </div>

            <!-- Content Area with Tabs (Write vs Live Preview) -->
            <div class="editor-card" style="padding: 0; overflow: hidden;">
              
              <!-- Editor Header Tabs -->
              <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; background: var(--bg-card); border-bottom: 1px solid var(--border-default);">
                <div style="display: flex; gap: 0.5rem;">
                  <button type="button" class="btn btn-secondary btn-sm active" id="tab-editor-write">✍️ Write</button>
                  <button type="button" class="btn btn-secondary btn-sm" id="tab-editor-preview">👁️ Live Preview</button>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted); display: flex; gap: 1rem;">
                  <span id="editor-word-count">0 words</span>
                  <span id="editor-reading-time">⏱️ 1 min read</span>
                </div>
              </div>

              <!-- Write Mode Area -->
              <div id="editor-textarea-wrapper">
                <!-- Formatting Toolbar -->
                <div class="editor-toolbar">
                  <button type="button" class="editor-tool-btn" data-tool="bold" title="Bold"><strong>B</strong></button>
                  <button type="button" class="editor-tool-btn" data-tool="italic" title="Italic"><em>I</em></button>
                  <button type="button" class="editor-tool-btn" data-tool="h2" title="Heading 2">H2</button>
                  <button type="button" class="editor-tool-btn" data-tool="h3" title="Heading 3">H3</button>
                  <button type="button" class="editor-tool-btn" data-tool="quote" title="Blockquote">”Quote</button>
                  <button type="button" class="editor-tool-btn" data-tool="code" title="Code Block">&lt;/&gt;</button>
                  <button type="button" class="editor-tool-btn" data-tool="ul" title="Bullet List">• List</button>
                  <button type="button" class="editor-tool-btn" data-tool="ol" title="Numbered List">1. List</button>
                  <button type="button" class="editor-tool-btn" data-tool="link" title="Insert Link">🔗 Link</button>
                </div>

                <!-- Textarea -->
                <textarea
                  id="post-content"
                  class="editor-textarea"
                  placeholder="Share your technical knowledge, code snippets, or tutorials here... Formatting with Markdown or HTML is supported."
                  required
                ></textarea>
              </div>

              <!-- Live Preview Area -->
              <div id="editor-preview-wrapper" class="prose" style="display: none; padding: 2rem; min-height: 480px; background: var(--bg-primary);">
                <!-- Rendered preview -->
              </div>

            </div>
          </div>

          <!-- Right Column: Settings & Publishing Controls -->
          <div>
            <div class="editor-card" style="margin-bottom: 1.5rem;">
              <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem;">Publish Settings</h3>
              
              <!-- Category Select -->
              <div class="form-group">
                <label class="form-label" for="post-category">Category *</label>
                <select id="post-category" class="form-select" required>
                  <option value="">Loading categories...</option>
                </select>
              </div>

              <!-- Interactive Tag Chips -->
              <div class="form-group">
                <label class="form-label">Tags</label>
                <div class="tags-chip-container" id="tags-chip-container">
                  <input
                    type="text"
                    id="tag-chip-input"
                    class="tag-chip-input"
                    placeholder="Type tag & press Enter..."
                  />
                </div>
                <div class="form-hint">Type a tag name and hit Enter or comma</div>
              </div>

              <!-- Featured Image URL -->
              <div class="form-group">
                <label class="form-label" for="post-featured-image">Featured Image URL</label>
                <input
                  type="url"
                  id="post-featured-image"
                  class="form-input"
                  placeholder="https://images.unsplash.com/..."
                />
                <img
                  id="featured-image-preview"
                  src=""
                  alt="Thumbnail Preview"
                  style="display: none; width: 100%; height: 140px; object-fit: cover; border-radius: var(--radius-md); margin-top: 0.6rem; border: 1px solid var(--border-default);"
                />
              </div>

              <!-- Feature Post Checkbox -->
              <div class="form-group" style="display: flex; align-items: center; gap: 0.6rem; margin-top: 1rem;">
                <input type="checkbox" id="post-is-featured" style="width: 18px; height: 18px; accent-color: var(--primary);" />
                <label for="post-is-featured" style="font-size: 0.92rem; font-weight: 600; cursor: pointer;">Feature on homepage hero</label>
              </div>

            </div>

            <!-- Publishing Actions Card -->
            <div class="editor-card">
              <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 1.25rem;">Actions</h3>
              <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <button type="button" id="btn-publish-post" class="btn btn-primary" style="width: 100%;">
                  🚀 Publish Post
                </button>
                <button type="button" id="btn-save-draft" class="btn btn-secondary" style="width: 100%;">
                  💾 Save as Draft
                </button>
                <a href="dashboard.html" class="btn btn-outline btn-sm" style="text-align: center;">
                  Cancel
                </a>
              </div>
            </div>

          </div>

        </div>
      </form>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <div>© 2026 BlogSphere. Author Post Studio.</div>
      <div><a href="dashboard.html">← Back to Dashboard</a></div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/ui.js" type="module"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/validation.js" type="module"></script>
  <script src="../js/editor.js" type="module"></script>

  <script type="module">
    import { initPostEditor } from '../js/editor.js';
    document.addEventListener('DOMContentLoaded', () => {
      initPostEditor();
    });
  </script>
</body>
</html>
