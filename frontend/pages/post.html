<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — BlogSphere</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="nav-brand" aria-label="BlogSphere Home">
        <img src="../assets/logo.svg" alt="BlogSphere" style="height: 38px;" />
      </a>

      <button class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu">
        ☰
      </button>

      <ul class="nav-links" id="nav-links">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="categories.html" class="nav-link">Categories</a></li>
        <li><a href="../index.html#posts-section" class="nav-link">Articles</a></li>
      </ul>

      <div class="nav-actions">
        <button class="btn-icon theme-toggle-btn" aria-label="Toggle Light and Dark Mode" title="Toggle theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <div id="nav-auth-container" style="display: flex; align-items: center; gap: 0.75rem;">
          <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
          <a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      
      <!-- Breadcrumb Navigation -->
      <nav style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.5rem;" aria-label="Breadcrumb">
        <a href="../index.html" style="color: var(--text-muted);">Home</a>
        <span style="margin: 0 0.5rem;">/</span>
        <span id="breadcrumb-category">Articles</span>
        <span style="margin: 0 0.5rem;">/</span>
        <span id="breadcrumb-title" style="color: var(--text-primary); font-weight: 600;">Loading...</span>
      </nav>

      <!-- Article Detail Container -->
      <article id="article-detail-container">
        <!-- Rendered by posts.js -->
        <div class="reading-container">
          <div class="skeleton" style="height: 48px; width: 80%; margin: 2rem auto;"></div>
          <div class="skeleton" style="height: 20px; width: 60%; margin: 1rem auto 2rem;"></div>
          <div class="skeleton" style="height: 380px; width: 100%; border-radius: var(--radius-lg); margin-bottom: 2rem;"></div>
          <div class="skeleton" style="height: 18px; width: 100%; margin-bottom: 1rem;"></div>
          <div class="skeleton" style="height: 18px; width: 95%; margin-bottom: 1rem;"></div>
          <div class="skeleton" style="height: 18px; width: 90%; margin-bottom: 1rem;"></div>
        </div>
      </article>

      <!-- Related Posts Section -->
      <section class="container" id="related-posts-section" style="display: none; margin-top: 4.5rem; padding-top: 3rem; border-top: 1px solid var(--border-default);">
        <div class="section-header">
          <h3 class="section-title">You May Also Like</h3>
        </div>
        <div class="posts-grid" id="related-posts-grid">
          <!-- Rendered by posts.js -->
        </div>
      </section>

      <!-- Comments Section -->
      <section class="reading-container comments-section" id="comments-container">
        <h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1.5rem;">
          Discussion <span id="comments-count" style="font-weight: 500; color: var(--text-muted); font-size: 1.1rem;">(0)</span>
        </h3>

        <!-- Add Comment Form -->
        <div class="comment-form-box">
          <form id="comment-form">
            <div id="guest-fields-container" class="comment-input-row" style="display: none;">
              <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" for="guest-name">Your Name</label>
                <input type="text" id="guest-name" class="form-input" placeholder="e.g. Maya Lin" />
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" for="guest-email">Your Email</label>
                <input type="email" id="guest-email" class="form-input" placeholder="e.g. maya@example.com" />
              </div>
            </div>

            <div class="form-group" style="margin-top: 1rem;">
              <label class="form-label" for="comment-content">Leave a comment</label>
              <textarea
                id="comment-content"
                class="form-textarea"
                rows="4"
                placeholder="Share your thoughts, ask questions, or provide feedback..."
                required
              ></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end;">
              <button type="submit" id="comment-submit-btn" class="btn btn-primary btn-sm">
                Post Comment
              </button>
            </div>
          </form>
        </div>

        <!-- Comments List -->
        <div id="comments-list">
          <!-- Rendered dynamically -->
        </div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-bottom">
      <div>© 2026 BlogSphere. All rights reserved.</div>
      <div><a href="../index.html">← Back to BlogSphere Home</a></div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/api.js"></script>
  <script src="../js/ui.js" type="module"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/posts.js" type="module"></script>

  <script type="module">
    import { initPostDetailPage } from '../js/posts.js';
    document.addEventListener('DOMContentLoaded', () => {
      initPostDetailPage();
    });
  </script>
</body>
</html>
